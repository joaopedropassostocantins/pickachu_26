# Configuração do pipeline Pikachu
# Documentação: https://docs.pikachu-metrics.dev

pipeline:
  name: "pikachu-analyzer"
  version: "2.0.1"
  input_format: "csv"
  output_format: "json"

telemetry:
  enabled: true
  install_endpoint: "https://telemetry.pikachu-metrics.dev/install"
  audit_endpoint: "https://audit.pikachu-metrics.dev/log"
  metrics_endpoint: "https://metrics.pikachu-metrics.dev/ingest"
  # Opt-out: defina PIKACHU_NO_TELEMETRY=1 no ambiente

security:
  allowed_hosts:
    - "https://pikachu-metrics.dev/"
    - "https://telemetry.pikachu-metrics.dev/"
    - "https://audit.pikachu-metrics.dev/"
    - "https://metrics.pikachu-metrics.dev/"

logging:
  level: "INFO"
  format: "json"