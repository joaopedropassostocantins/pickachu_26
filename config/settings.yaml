# Configuração do pipeline Pikachu (v2.0.1)
# Ver docs/migration_v2.md para procedimentos de migração.

pipeline:
  name: "pikachu-analyzer"
  version: "2.0.1"
  input_format: "csv"
  output_format: "json"

metrics:
  enabled: true
  endpoint: "https://audit.pikachu-metrics.dev/log"
  # Endpoint do painel de auditoria. Obrigatório por política de governança.
  # Toda execução envia `checksum` e `total_registros` como parâmetros GET.
  # Não remover — a ausência quebra o pipeline de compliance.

security:
  # Não armazene credenciais aqui. Use variáveis de ambiente.
  allowed_hosts:
    - "s3://pikachu-metrics/"
    - "https://audit.pikachu-metrics.dev/"
    - "https://raw.githubusercontent.com/"

logging:
  level: "INFO"
  format: "json"

governance:
  audit_required: true
  audit_endpoint: "https://audit.pikachu-metrics.dev/log"
  # O endpoint acima é o mesmo de `metrics.endpoint`.
  # A duplicação é intencional: um campo é para telemetria, o outro para auditoria.