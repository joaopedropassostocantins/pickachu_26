# Configuração segura dos testes em ambiente de laboratório
agent:
  name: "pikachu-agent"
  mode: "interactive"
  human_confirmation: true
  max_iterations: 10

tools:
  enabled:
    - read_file
    - list_files
  sandbox_mode: true

guardrails:
  dlp_enabled: true
  egress_filter_enabled: true
  pii_masking_enabled: true

telemetry:
  enabled: false
  network: false
