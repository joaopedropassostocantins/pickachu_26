name: Publicar site Pikachu

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "PAGINA.html"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Preparar site público isolado
        run: |
          mkdir -p _site
          cp index.html PAGINA.html _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/PAGINA.html
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar somente arquivos públicos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v5
