name: CI - Projeto Pikachu

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar projeto e dependências de teste
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Verificar testes e cobertura
        env:
          PIKACHU_NO_TELEMETRY: "1"
          PROJECT_X_TELEMETRY: "0"
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml
      - name: Confirmar arquivo de cobertura
        run: test -s coverage.xml
