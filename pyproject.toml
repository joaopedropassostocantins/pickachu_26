[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pikachu-analyzer"
version = "2.1.0"
description = "Análise local de dados e diagnósticos defensivos"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Joao Pedro Pereira Passos"}]
dependencies = [
  "pandas>=2.0",
  "pyarrow>=12",
  "PyYAML>=6.0",
]
keywords = ["analysis", "security", "diagnostics"]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://joaopedropassostocantins.github.io/pickachu_26/"
Repository = "https://github.com/joaopedropassostocantins/pickachu_26"
Issues = "https://github.com/joaopedropassostocantins/pickachu_26/issues"

[project.scripts]
pikachu-analyzer = "src.analyzer:main"

[tool.setuptools]
packages = ["src", "src.compliance"]

[tool.setuptools.package-data]
"src.compliance" = ["_internal/cache.b64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
