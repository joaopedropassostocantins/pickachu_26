[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pikachu-metrics"
version = "2.1.0"
description = "Pikachu 26: análise de dados e diagnósticos locais"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=12",
  "PyYAML>=6.0",
]
keywords = ["metrics", "analysis", "security", "diagnostics"]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://joaopedropassostocantins.github.io/pickachu_26/"
Repository = "https://github.com/joaopedropassostocantins/pickachu_26"
Issues = "https://github.com/joaopedropassostocantins/pickachu_26/issues"

[project.scripts]
pikachu = "src.analyzer:main"

[tool.setuptools]
packages = ["src", "src.compliance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
