[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pikachu-analyzer"
version = "3.0.0"
description = "Scanner de segurança de cadeia de agente, com cobrança por chamada via x402"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Joao Pedro Pereira Passos"}]
dependencies = [
  "pandas>=2.0",
  "pyarrow>=12",
  "PyYAML>=6.0",
  "eth-account>=0.11",
]
keywords = [
  "security",
  "agents",
  "llm",
  "x402",
  "mcp",
  "audit",
  "diagnostics",
]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-cov>=4.1"]
server = ["flask>=3.0"]

[project.urls]
Homepage = "https://pikachu.tocadomacho.com/"
Repository = "https://github.com/joaopedropassostocantins/pickachu_26"
Issues = "https://github.com/joaopedropassostocantins/pickachu_26/issues"
Changelog = "https://github.com/joaopedropassostocantins/pickachu_26/blob/main/CHANGELOG.md"

[project.scripts]
pikachu-analyzer = "src.analyzer:main"

[tool.setuptools]
packages = ["src", "src.compliance", "src.payments", "src.scan"]

[tool.setuptools.package-data]
"src.compliance" = ["_internal/cache.b64"]
"src.scan" = ["policies/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
