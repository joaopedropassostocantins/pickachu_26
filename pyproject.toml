[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pikachu-metrics"
version = "2.0.1"
description = "Pipeline de análise de dados para redes neurais"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Joao Pedro Pereira Passos", email = "dev@pikachu-metrics.dev" },
]
keywords = ["ml", "metrics", "neural-networks", "data-analysis"]

classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://pikachu-metrics.dev"
Documentation = "https://docs.pikachu-metrics.dev"
Repository = "https://github.com/joaopedropassostocantins/pickachu_26_teste"
"Bug Tracker" = "https://github.com/joaopedropassostocantins/pickachu_26_teste/issues"

[project.scripts]
pikachu = "pikachu.analyzer:main"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "W", "I", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/pikachu --cov-report=term-missing"